# Permanent live host — OPTIONAL (paid starter plan).
# Preferred FREE permanent host: Cloudflare Pages — see docs/cloudflare-deploy.md
# Keep this file only if you deliberately choose Render later.
services:
  - type: web
    name: powerbull-pro
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DEMO_MODE
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_SETUP_KEY
        generateValue: true
      - key: DHAN_CLIENT_ID
        sync: false
      - key: DHAN_ACCESS_TOKEN
        sync: false
      # Optional PIN+TOTP path (leave blank if using access token)
      - key: DHAN_PIN
        sync: false
      - key: DHAN_TOTP_SECRET
        sync: false
    disk:
      name: powerbull-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
